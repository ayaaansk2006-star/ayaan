<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Track Order — Altitude Moto</title><link rel="icon" href="/favicon.png"><link rel="manifest" href="/manifest.json"><link rel="apple-touch-icon" href="/icon-192.png"><link rel="stylesheet" href="/css/style.css?v=7">
<style>
.tl { list-style: none; margin: 22px 0; padding: 0; position: relative; }
.tl li { position: relative; padding: 0 0 22px 44px; color: var(--muted); }
.tl li::before { content: ""; position: absolute; left: 13px; top: 28px; bottom: 0; width: 2px; background: var(--line); }
.tl li:last-child::before { display: none; }
.tl li.done::before { background: var(--lime); }
.tl .dot { position: absolute; left: 0; top: 0; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); background: #0e0e0e; display: grid; place-items: center; }
.tl li.done .dot { background: var(--lime); border-color: var(--lime); color: #000; }
.tl li.now .dot { box-shadow: 0 0 0 6px rgba(254,245,2,.15); }
.tl b { color: #fff; display: block; } .tl small { font-size: 13px; }
.eta { display: flex; gap: 12px; align-items: center; padding: 14px; border-radius: 12px; background: rgba(254,245,2,.08); border: 1px solid rgba(254,245,2,.3); margin-top: 14px; }
.ship { padding: 14px; border-radius: 12px; border: 1px solid var(--line); margin-top: 12px; }
.after { display: grid; gap: 10px; margin-top: 12px; }
.asb { width: 100%; border-color: #444; color: #ddd; }
.req { display: grid; gap: 4px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); }
.req.pending { border-color: rgba(254,245,2,.5); } .req.approved { border-color: #2e7d32; } .req.rejected { border-color: var(--red); }
.req small, .rnote { color: var(--muted); font-size: 13px; }
.req-form { padding: 14px; border: 1px dashed #444; border-radius: 12px; }
</style>
<link rel="stylesheet" href="/css/polish.css?v=2">
</head>
<body>
<header class="top"><div class="wrap">
  <a href="/" class="brand"><img src="/logo.png?v=2" alt="">ALTITUDE MOTO</a>
  <nav class="links"><a href="/">Shop</a><a href="/review">Reviews</a><a href="/account">Account</a></nav>
</div></header>
<main class="wrap" style="max-width:720px;padding:50px 20px">
  <div id="success" class="panel" style="display:none;text-align:center;margin-bottom:20px;border-color:var(--lime)">
    <h1 class="display lime">Order placed!</h1>
    <p>A confirmation email is on its way. We'll verify your payment and update you.</p>
  </div>
  <form class="panel form" id="form">
    <h2 class="display">Track your order</h2>
    <div class="two"><label>Order ID<input name="oid" required></label><label>Email<input name="email" type="email" required></label></div>
    <button class="btn">Track</button><div class="err" id="err"></div>
  </form>
  <div id="result" class="panel" style="display:none;margin-top:20px"></div>
</main>
<script src="/js/common.js?v=8"></script>
<script src="/js/aftersales.js?v=1"></script>
<script src="/js/track.js?v=2"></script>
</body>
</html>
