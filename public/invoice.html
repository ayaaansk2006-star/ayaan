<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Invoice — Altitude Moto</title><link rel="icon" href="/favicon.png">
<style>
body { font-family: Arial, sans-serif; color: #111; background: #eee; margin: 0; padding: 20px; }
.inv { max-width: 800px; margin: auto; background: #fff; padding: 36px; border-radius: 8px; }
.top { display: flex; justify-content: space-between; gap: 20px; border-bottom: 3px solid #111; padding-bottom: 16px; }
.top img { width: 56px; height: 56px; border-radius: 8px; } h1 { margin: 0; font-size: 26px; letter-spacing: 2px; }
.muted { color: #555; font-size: 13px; line-height: 1.5; } .two { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 20px 0; }
table { width: 100%; border-collapse: collapse; } th, td { padding: 10px 8px; border-bottom: 1px solid #ddd; text-align: left; font-size: 14px; }
th { background: #111; color: #FEF502; } .r { text-align: right; } .tot td { font-weight: bold; font-size: 16px; border-top: 2px solid #111; }
.bar { max-width: 800px; margin: 0 auto 14px; display: flex; gap: 10px; }
.bar button, .bar a { padding: 12px 20px; border-radius: 8px; border: 0; background: #FEF502; font-weight: bold; cursor: pointer; color: #000; text-decoration: none; font-size: 15px; }
.bar a { background: #fff; } #err { color: #c00; text-align: center; }
@media (max-width: 600px) { .inv { padding: 18px; } .two, .top { grid-template-columns: 1fr; display: grid; } }
@media print { body { background: #fff; padding: 0; } .bar { display: none; } .inv { padding: 0; } }
</style>
</head>
<body>
<div class="bar"><button onclick="print()">Download PDF / Print</button><a href="javascript:history.back()">← Back</a></div>
<p id="err"></p>
<div class="inv" id="inv" style="display:none"></div>
<script src="/js/common.js?v=8"></script>
<script src="/js/invoice.js?v=1"></script>
</body>
</html>
