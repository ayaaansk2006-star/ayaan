<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Account — Altitude Moto</title><link rel="icon" href="/favicon.png"><link rel="manifest" href="/manifest.json"><link rel="apple-touch-icon" href="/icon-192.png"><link rel="stylesheet" href="/css/style.css?v=7">
<style>
.tabs { display: flex; gap: 8px; margin-bottom: 16px; }
.tabs button { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: none; color: #fff; font: inherit; cursor: pointer; }
.tabs button.on { background: var(--lime); color: #000; font-weight: 700; border-color: var(--lime); }
.ord { border-bottom: 1px solid var(--line); }
.ord summary { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; padding: 14px 0; cursor: pointer; list-style: none; }
.ord summary > .pbar, .ord summary > .ord-acts, .ord summary > .pcancel { width: 100%; margin: 0; }
.ord .more { color: var(--muted); }
.ord summary::-webkit-details-marker { display: none; }

.ord-body { padding: 0 0 16px; display: grid; gap: 8px; animation: rise2 .3s ease-out; } .ord-body ul, .tl { padding-left: 18px; }
.tl small, .ord-body small { color: var(--muted); }
.pbar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin: 0 0 12px; }
.pbar span { font-size: 11px; color: var(--muted); padding-top: 8px; border-top: 4px solid #2a2a2a; }
.pbar span.on { color: #fff; border-color: var(--lime); }
.pcancel { color: var(--red); font-size: 13px; margin: 0 0 12px; }
.ord-acts { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.ord-acts .btn { padding: 8px 14px; font-size: 13px; }
@keyframes rise2 { from { opacity: 0; transform: translateY(-6px); } }
</style>
<link rel="stylesheet" href="/css/polish.css?v=2">
</head>
<body>
<header class="top"><div class="wrap">
  <a href="/" class="brand"><img src="/logo.png?v=2" alt="">ALTITUDE MOTO</a>
  <nav class="links"><a href="/">Shop</a><a href="/track">Track Order</a><a href="/review">Reviews</a></nav>
</div></header>
<main class="wrap" style="max-width:720px;padding:50px 20px">
  <div id="guest" class="panel" style="display:none">
    <div class="tabs"><button id="tIn" class="on">Sign in</button><button id="tUp">Create account</button></div>
    <form class="form" id="auth">
      <label id="nameRow" style="display:none">Full name<input name="name" maxlength="80"></label>
      <label>Email<input name="email" type="email" required autocomplete="email"></label>
      <label>Password<input name="password" type="password" required minlength="8" autocomplete="current-password"></label>
      <button class="btn" id="authBtn">Sign in</button><div class="err" id="aerr"></div>
    </form>
    <p style="color:var(--muted);font-size:13px;margin-top:12px">You can still order without an account. Orders placed while signed in appear here.</p>
  </div>
  <div id="me" style="display:none">
    <div class="row"><h2 class="display">My Account</h2><button class="btn ghost" id="logout">Sign out</button></div>
    <p id="hello" style="color:var(--muted)"></p>
    <div class="panel" style="margin-top:18px"><h3 class="display">My orders</h3><div id="orders"></div></div>
    <form class="panel form" id="addr" style="margin-top:18px"><h3 class="display">Saved address</h3>
      <div class="two"><label>Full name<input name="name" maxlength="80"></label><label>Mobile<input name="phone" inputmode="numeric"></label></div>
      <label>Address<textarea name="address" rows="2" maxlength="300"></textarea></label>
      <div class="two"><label>City<input name="city"></label><label>State<input name="state"></label></div>
      <label>Pincode<input name="pincode" inputmode="numeric" maxlength="6"></label>
      <button class="btn">Save address</button></form>
  </div>
</main>
<script src="/js/common.js?v=8"></script>
<script src="/js/account.js?v=3"></script>
</body>
</html>
